# Strider Runner - Unity CI
# Author: Mithin Sagar S
# GitHub: https://github.com/mithinsagar
#
# Runs on pull requests and pushes to main. Requires the following secrets to
# be configured on the repository:
#   UNITY_LICENSE       - contents of a valid .ulf license file
#   UNITY_EMAIL         - Unity account email
#   UNITY_PASSWORD      - Unity account password
#
# The workflow uses the game-ci actions to activate a license, run edit-mode
# and play-mode tests, and build for Windows and WebGL. Adjust the target
# matrix as needed.
#
# Those credentials are not configured on this repo yet, so both jobs below
# check for the license secret's presence before running: without it, the
# Unity Editor step has nothing valid to activate with and every run would
# fail the same way regardless of what the code does. The check reports the
# run as skipped instead of failed until real credentials are added, rather
# than leaving a permanently red, code-unrelated check on every commit.

name: Unity CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check-secrets:
    name: Check Unity credentials
    runs-on: ubuntu-latest
    outputs:
      has-license: ${{ steps.check.outputs.has-license }}
    steps:
      - id: check
        run: |
          if [ -n "$UNITY_LICENSE_SET" ]; then
            echo "has-license=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-license=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          UNITY_LICENSE_SET: ${{ secrets.UNITY_LICENSE }}

  test:
    name: Test in Editor
    runs-on: ubuntu-latest
    needs: check-secrets
    if: needs.check-secrets.outputs.has-license == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Run tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          testMode: all
          artifactsPath: artifacts/test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test results
          path: artifacts/test-results

  build:
    name: Build ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    needs: [check-secrets, test]
    if: needs.check-secrets.outputs.has-license == 'true'
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneWindows64
          - WebGL
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: StriderRunner

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Build-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
